services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: "asac"
      POSTGRES_PASSWORD: "1234"
      POSTGRES_DB: "example"
    ports:
      - "54322:5432"

  spring-app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: develop
    depends_on:
      - postgres
